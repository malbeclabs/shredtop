[workspace]
resolver = "2"
members = [
    ".",
    "crates/shred-ingest",
]

[workspace.package]
version = "2.1.1"
edition = "2021"
rust-version = "1.81"

[workspace.dependencies]
jemallocator = "0.5"

# Solana — decomposed crates pinned to Agave 4.x (3.x cannot decode v1 transactions)
solana-pubkey = "3.0"
solana-transaction = { version = "4.1", features = ["wincode"] }
solana-commitment-config = "3.1"
solana-transaction-status = "4.2"
solana-client = "4.2"

# gRPC Geyser / Jito ShredStream
yellowstone-grpc-proto = "12"
tonic = "0.14"
tonic-prost = "0.14"
futures-util = "0.3"
prost = { version = "0.14", features = ["derive"] }

# Async / networking
socket2 = "0.5"
tokio = { version = "1", features = ["rt", "time"] }

# Solana helpers needed for gRPC source construction
solana-signature = "3"
# 4.4+: earlier v1 readers report a cut-off v1 message as invalid, not truncated
solana-message = "4.4"

# Concurrency
crossbeam-channel = "0.5"
dashmap = "6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
# v1 transactions only decode through wincode, not bincode
wincode = "0.5"

# Reed-Solomon erasure coding
reed-solomon-erasure = { version = "6", features = ["std"] }

# Misc
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
pcap-file = "2"

# ─── Binary crate ────────────────────────────────────────────────────────────

[package]
name = "shredtop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Solana shred feed latency benchmark — measure your edge before the block lands"
license = "MIT"

[[bin]]
name = "shredtop"
path = "src/main.rs"

[dependencies]
shred-ingest = { path = "crates/shred-ingest" }
jemallocator = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
clap = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
pcap-file = { workspace = true }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
